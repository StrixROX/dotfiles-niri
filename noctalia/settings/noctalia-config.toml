config_version = 13

[audio]
enable_sounds = true
sound_volume = 0.99999997764825821

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    center = [ "group:g3" ]
    end = [ "tray", "clipboard", "group:g2", "group:g1", "notifications" ]
    font_weight = 400
    layer = "overlay"
    margin_edge = 4
    margin_ends = 300
    radius = 16
    reserve_space = false
    smart_auto_hide = true
    start = [ "launcher", "gamemode", "devmode", "w-engine-widget", "media", "audio_visualizer" ]
    widget_spacing = 8

        [bar.default.actions]
        middle = "none"

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "network", "bluetooth", "volume", "battery" ]
        opacity = 1.0
        padding = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "temp", "cpu", "ram" ]
        opacity = 1.0
        padding = 8.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "clock" ]
        opacity = 1.0
        padding = 12.0

[battery]
warning_threshold = 20

[control_center]
sidebar_section = "none"

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "caffeine"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.74999998323619366
cross_axis_padding = 4
enabled = true
item_spacing = 8
magnification_scale = 1.7500000111758709
pinned = [
    "kitty",
    "org.gnome.Nautilus",
    "microsoft-edge",
    "steam",
    "msedge-cinhimbnkkaeohfgghhklpknlkffjgod-Default",
    "hermes",
    "com.anthropic.Claude",
    "lm-studio",
    "dev.zed.Zed"
]
position = "right"
reserve_space = false
show_instance_count = false
smart_auto_hide = true

[hooks]
rebooting = "~/.config/niri/myconfigs/noctalia/hooks/on_reboot.sh"
session_locked = "~/.config/niri/myconfigs/noctalia/hooks/on_session_locked.sh"
session_unlocked = "~/.config/niri/myconfigs/noctalia/hooks/on_session_unlocked.sh"
shutting_down = "~/.config/niri/myconfigs/noctalia/hooks/on_shutdown.sh"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
wallpaper = "/home/strixrox/nc_data/Photos/wuwa2.jpeg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [
    "lockscreen-login-box@winit",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 944.0
    cy = 954.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.45000000000000001
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = false

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 720.0
    cx = 474.0
    cy = 945.0
    output = "winit"
    placement_height = 1064.0
    placement_width = 948.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 352.0
    box_width = 480.0
    cx = 1488.0
    cy = 268.0
    enabled = false
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_opacity = 0.27000000000000002
        background_radius = 18.0
        center_text = false
        format = "{:%I:%M}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 112.0
    box_width = 160.0
    cx = 1816.0
    cy = 236.0
    enabled = false
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        clock_style = "digital"
        format = "{:%p}"
        shadow = false

[nightlight]
enabled = true
temperature_night = 3500

[notification]
position = "bottom_right"

[plugin_settings."noctalia/notes"]
notes_dir = "~/"

[plugin_settings."tadomika_ari/w-engine"]
grid_columns = 3
w-engine-panel_placement = "attached"

[plugins]
enabled = [ "tadomika_ari/w-engine" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "Space Grotesk"
polkit_agent = true
settings_show_advanced = false
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    app_grid = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_app_grid = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    directory = "/home/strixrox/screenshots"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "neovim", "zed", "fastfetch", "yazi" ]

[wallpaper]
directory = "/home/strixrox/nc_data/Photos"

    [wallpaper.default]
    path = "/home/strixrox/nc_data/Photos/Yugachakra A.jpg"

    [wallpaper.last]
    path = "/home/strixrox/nc_data/Photos/Yugachakra A.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/strixrox/nc_data/Photos/Yugachakra A.jpg"

[widget.audio_visualizer]
color_2 = "secondary"
mirrored = false

[widget.cat]
audio_spectrum = true
input_devices = [ "/dev/input/event17", "/dev/input/by-id/*-event-*", "/dev/input/by-path/*-event-*" ]
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clipboard]
capsule = true
capsule_padding = 8

[widget.clock]
format = "{:%-I:%M %p  %a %d %b}"

    [widget.clock.actions]
    middle = "none"

[widget.cpu]
display = "text"
enabled = false
visualization = "none"

[widget.devmode]
glyph = "code"
type = "custom_button"

    [widget.devmode.actions]
    left = "exec systemctl --user start devmode"
    right = "exec systemctl --user stop devmode"

[widget.gamemode]
glyph = "bluetooth-device-gamepad"
type = "custom_button"

    [widget.gamemode.actions]
    left = "exec pkexec systemctl start gamemode.service"

[widget.launcher]
glyph = "apps"

[widget.media]
capsule = true
capsule_padding = 12.0
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.ram]
display = "text"
enabled = false
stat = "ram_pct"
visualization = "none"

[widget.temp]
display = "text"
glyph = "temperature"
visualization = "none"

[widget.tray]
capsule = true
capsule_padding = 12.0
drawer = true
enabled = false

[widget.volume]
show_label = false

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"